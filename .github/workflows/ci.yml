name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    name: cargo test
    # GitHub-hosted runners are blocked by org billing; macOS is covered by the
    # cross-compiled release builds.
    runs-on: [self-hosted, gb]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.83.0

      - name: Test
        run: cargo test

  web:
    name: web test and build
    runs-on: [self-hosted, gb]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Analytics tag is in the built page
        run: grep -Fq 'G-FG52JBJRPS' web/dist/index.html

      - name: Installer is served from the site root
        run: |
          bash -n install.sh
          cmp install.sh web/dist/install.sh
