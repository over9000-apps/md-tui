name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: md-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: md-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: md-macos-x86_64
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.83.0
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p md

      - name: Package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/md"
          test -x "$bin"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "$bin" "${{ matrix.artifact }}.exe"
          else
            cp "$bin" "${{ matrix.artifact }}"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
